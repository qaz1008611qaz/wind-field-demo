<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGL2 风场粒子 Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070d;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }

    #gl {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 8px 12px;
      background: rgba(10, 14, 22, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      pointer-events: none;
      user-select: none;
      line-height: 1.5;
    }

    #hud h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    #fps {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: #7ee787;
    }

    #info {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      color: #8b949e;
    }

    #error {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 520px;
      padding: 16px 20px;
      background: rgba(60, 12, 12, 0.92);
      border: 1px solid #f85149;
      border-radius: 8px;
      color: #ffdcd7;
      font-size: 14px;
      line-height: 1.6;
      display: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>

  <div id="hud">
    <h1>WebGL2 Wind Field Particles</h1>
    <div id="fps">FPS: --</div>
    <div id="info">按 I 切换插值：bilinear</div>
  </div>

  <div id="error"></div>

  <script>
    // ES Module 在 file:// 协议下会被浏览器的 CORS 策略拦截，提前给出提示
    if (location.protocol === "file:") {
      var el = document.getElementById("error");
      el.style.display = "block";
      el.textContent =
        "检测到通过 file:// 打开。\n" +
        "ES Module 需要通过本地 HTTP 服务器加载，请在项目根目录运行：\n\n" +
        "  python3 -m http.server 8000\n\n" +
        "然后访问 http://localhost:8000";
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
